<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VEXUS Trade</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TradingView Lightweight Charts для японских свечей -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161a25;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --brand-blue: #00f2fe;
            --text-main: #ffffff;
            --text-sub: #787e87;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-green), var(--brand-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: 1px;
        }

        .badge {
            font-size: 11px;
            background: rgba(0, 242, 254, 0.1);
            color: var(--brand-blue);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(22, 26, 37, 0.9), rgba(16, 20, 29, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .balance-block {
            display: flex;
            flex-direction: column;
        }

        .balance-title {
            font-size: 11px;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .balance-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .stats-block {
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 12px;
            color: var(--text-sub);
            text-align: right;
            gap: 4px;
        }

        .stats-block span { color: #fff; font-weight: 600; }

        .clicker-btn {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            border-radius: 12px;
            padding: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: all 0.2s;
        }

        .clicker-btn:active {
            transform: scale(0.97);
            background: var(--accent-green);
            color: #000;
        }

        .asset-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .asset-price {
            color: var(--accent-green);
            font-family: monospace;
            font-size: 16px;
        }

        /* Контейнер для свечного графика */
        #chart-container {
            width: 100%;
            height: 200px;
        }

        .trade-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn-trade {
            flex: 1;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: transform 0.1s;
        }

        .btn-up { background: linear-gradient(135deg, #00e676, #00b0ff); box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3); }
        .btn-down { background: linear-gradient(135deg, #ff1744, #ff5252); box-shadow: 0 4px 15px rgba(255, 23, 68, 0.3); }
        .btn-trade:active { transform: scale(0.96); }

        .status-msg {
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
            min-height: 20px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .passive-income-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .income-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .income-card:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.1);
        }

        .income-card h4 { margin: 0; font-size: 13px; color: #fff; }
        .income-card p { margin: 0; font-size: 11px; color: var(--text-sub); }
        .price-tag { color: var(--accent-green); font-weight: bold; font-size: 12px; margin-top: 4px; }

    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">VEXUS TRADE</h1>
        <span class="badge">GAME FULL</span>
    </div>

    <!-- Дашборд Игрока -->
    <div class="glass-card">
        <div class="dashboard">
            <div class="balance-block">
                <div class="balance-title">Баланс USD</div>
                <div class="balance-value" id="balance">$100</div>
            </div>
            <div class="stats-block">
                <div>⛏ Фермы: <span id="miner-count">0</span></div>
                <div>🪙 VEX: <span id="vex-count" style="color: #00f2fe;">0.00</span></div>
                <div style="color: var(--accent-green); font-size: 10px; margin-top: 4px;" id="income-rate">+$0 / сек</div>
            </div>
        </div>
        <button class="clicker-btn" onclick="tapEarn()">💰 Клик: +$10</button>
    </div>

    <!-- Свечной График -->
    <div class="glass-card" style="padding: 16px 16px 8px 16px;">
        <div class="asset-info">
            <span>📈 BTC / USD</span>
            <span class="asset-price" id="current-price">$65,000</span>
        </div>
        <div id="chart-container"></div>
    </div>

    <!-- Трейдинг Вверх/Вниз -->
    <div class="trade-actions">
        <button class="btn-trade btn-up" onclick="makeTrade('UP')">
            <span>▲ ВВЕРХ</span>
            <span style="font-size: 11px; font-weight: 400;">Ставка $20</span>
        </button>
        <button class="btn-trade btn-down" onclick="makeTrade('DOWN')">
            <span>▼ ВНИЗ</span>
            <span style="font-size: 11px; font-weight: 400;">Ставка $20</span>
        </button>
    </div>
    <div class="status-msg" id="status">Прогноз рынка (5 секунд)</div>

    <!-- Экономика игры: Покупки -->
    <div class="section-title">Магазин и Развитие</div>
    <div class="passive-income-grid">
        <div class="income-card" onclick="buyMiner()">
            <h4>⛏ Майнинг ферма</h4>
            <p>Пассивный доход +$1/сек</p>
            <div class="price-tag">Цена: $50</div>
        </div>
        <div class="income-card" onclick="buyVex()">
            <h4>🪙 Купить VEX</h4>
            <p>Инвестируй в токен сети</p>
            <div class="price-tag">Цена: $100 за 10 VEX</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Игровые переменные
        let balance = 100;
        let btcPrice = 65000;
        let isTrading = false;
        let miners = 0;
        let vexTokens = 0;

        // --- ИНИЦИАЛИЗАЦИЯ СВЕЧНОГО ГРАФИКА TRADINGVIEW ---
        const chartProperties = {
            layout: { 
                background: { type: 'solid', color: 'transparent' }, 
                textColor: '#787e87' 
            },
            grid: { 
                vertLines: { color: 'rgba(255, 255, 255, 0.03)' }, 
                horzLines: { color: 'rgba(255, 255, 255, 0.03)' } 
            },
            timeScale: { timeVisible: true, secondsVisible: true },
            crosshair: { mode: 0 }
        };
        
        const chart = LightweightCharts.createChart(document.getElementById('chart-container'), chartProperties);
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#00ff88', downColor: '#ff3366', 
            borderVisible: false, 
            wickUpColor: '#00ff88', wickDownColor: '#ff3366'
        });

        // Генерация начальных данных для свечей
        let currentTime = Math.floor(Date.now() / 1000) - 60;
        let chartData = [];
        for(let i = 0; i < 60; i++) {
            let open = btcPrice;
            let close = open + (Math.random() - 0.5) * 40;
            chartData.push({ 
                time: currentTime + i, 
                open: open, 
                high: Math.max(open, close) + 5, 
                low: Math.min(open, close) - 5, 
                close: close 
            });
            btcPrice = close;
        }
        candleSeries.setData(chartData);

        // Обновление живой свечи каждую секунду
        setInterval(() => {
            let open = btcPrice;
            let close = open + (Math.random() - 0.5) * 50;
            currentTime++;
            candleSeries.update({
                time: currentTime,
                open: open,
                high: Math.max(open, close) + Math.random() * 10,
                low: Math.min(open, close) - Math.random() * 10,
                close: close
            });
            btcPrice = close;
            document.getElementById('current-price').innerText = '$' + Math.round(btcPrice).toLocaleString();
        }, 1000);

        // --- ЛОГИКА ИГРЫ ---
        function updateUI() {
            document.getElementById('balance').innerText = '$' + balance;
            document.getElementById('miner-count').innerText = miners;
            document.getElementById('vex-count').innerText = vexTokens;
            document.getElementById('income-rate').innerText = '+$' + miners + ' / сек';
        }

        function tapEarn() {
            balance += 10;
            updateUI();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        // Покупка майнера
        function buyMiner() {
            if (balance >= 50) {
                balance -= 50;
                miners++;
                updateUI();
                document.getElementById('status').innerText = '✅ Майнинг ферма куплена!';
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                document.getElementById('status').innerText = '❌ Не хватает денег на Майнер ($50)';
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        // Покупка токена VEX
        function buyVex() {
            if (balance >= 100) {
                balance -= 100;
                vexTokens += 10;
                updateUI();
                document.getElementById('status').innerText = '✅ Куплено 10 VEX!';
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                document.getElementById('status').innerText = '❌ Не хватает денег на VEX ($100)';
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        // Пассивный доход каждую секунду
        setInterval(() => {
            if (miners > 0) {
                balance += miners; // 1 доллар за каждого майнера
                updateUI();
            }
        }, 1000);

        // Система трейдинга
        function makeTrade(direction) {
            if(isTrading) return;
            if(balance < 20) {
                document.getElementById('status').innerText = '❌ Недостаточно средств для ставки ($20)';
                return;
            }

            isTrading = true;
            balance -= 20;
            updateUI();

            let entryPrice = btcPrice;
            let timer = 5;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            let countdown = setInterval(() => {
                timer--;
                if(timer > 0) {
                    document.getElementById('status').innerText = `⏳ Сделка открыта (${direction}). Ждём: ${timer} сек`;
                } else {
                    clearInterval(countdown);
                    let exitPrice = btcPrice;
                    let win = false;

                    if(direction === 'UP' && exitPrice > entryPrice) win = true;
                    if(direction === 'DOWN' && exitPrice < entryPrice) win = true;

                    if(win) {
                        balance += 40;
                        document.getElementById('status').innerText = `✅ Прогноз верен! Выиграно +$40`;
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    } else {
                        document.getElementById('status').innerText = `❌ Рынок пошел в другую сторону (-$20)`;
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    }
                    
                    updateUI();
                    isTrading = false;
                }
            }, 1000);
        }
    </script>
</body>
</html>
