<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CS:UPGRADE // VEX EDITION</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0c0e14;
            --card-bg: #151822;
            --accent-gold: #ffb700;
            --accent-gold-glow: rgba(255, 183, 0, 0.4);
            --accent-green: #00ff88;
            --accent-red: #ff3355;
            --text-main: #ffffff;
            --text-sub: #7b8396;
            
            /* Цвета редкостей CS */
            --rarity-covert: #eb4b4b;
            --rarity-classified: #d32ce6;
            --rarity-restricted: #8847ff;
            --rarity-mil-spec: #4b69ff;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 12px; padding-bottom: 30px; 
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .title { font-size: 18px; font-weight: 900; color: var(--accent-gold); letter-spacing: 1px; }
        .balance-box { font-size: 16px; font-weight: 900; color: var(--accent-green); background: rgba(0,255,136,0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(0,255,136,0.2); }

        /* Тапалка баланса */
        .tap-btn {
            background: linear-gradient(135deg, rgba(255,183,0,0.15), rgba(255,255,255,0.03));
            border: 1px solid var(--accent-gold); border-radius: 12px;
            padding: 12px; text-align: center; font-weight: 800; font-size: 14px;
            color: var(--accent-gold); cursor: pointer; margin-bottom: 12px;
        }
        .tap-btn:active { transform: scale(0.98); background: rgba(255,183,0,0.25); }

        /* ЗОНА АПГРЕЙДА (CS-STYLE) */
        .upgrade-container {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin-bottom: 14px;
        }

        .upgrade-slots {
            display: grid;
            grid-template-columns: 1fr 120px 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 14px;
        }

        /* Карточки предметов (Слева и Справа) */
        .slot-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px; text-align: center;
            min-height: 120px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        .slot-card.active { border-color: var(--accent-gold); box-shadow: 0 0 15px var(--accent-gold-glow); }
        .slot-label { font-size: 9px; color: var(--text-sub); text-transform: uppercase; margin-bottom: 6px; font-weight: 700; }
        .slot-emoji { font-size: 32px; margin-bottom: 4px; }
        .slot-name { font-size: 11px; font-weight: 800; line-height: 1.2; height: 26px; overflow: hidden; }
        .slot-price { font-size: 12px; font-weight: 900; color: var(--accent-gold); margin-top: 4px; }

        /* Радиальный круг рулетки (Центр) */
        .wheel-box {
            position: relative; width: 110px; height: 110px;
            display: flex; align-items: center; justify-content: center; margin: 0 auto;
        }
        .wheel-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .wheel-bg { fill: none; stroke: rgba(255, 51, 85, 0.2); stroke-width: 8; }
        .wheel-progress { 
            fill: none; stroke: var(--accent-gold); stroke-width: 8; 
            stroke-dasharray: 283; stroke-dashoffset: 141; /* 50% по дефолту */
            transition: stroke-dashoffset 0.3s ease;
        }

        /* Стрелка индикатора */
        .wheel-arrow {
            position: absolute; top: 2px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 10px solid #fff;
            z-index: 10; filter: drop-shadow(0 0 5px #000);
            transition: transform 2s cubic-bezier(0.15, 0.9, 0.2, 1);
            transform-origin: 50% 53px;
        }

        .chance-text {
            position: absolute; text-align: center; font-size: 16px; font-weight: 900; color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .chance-sub { font-size: 8px; color: var(--text-sub); display: block; text-transform: uppercase; }

        /* Кнопка Прокачать */
        .btn-upgrade-main {
            width: 100%; background: linear-gradient(135deg, #ffb700, #ff8c00);
            color: #000; border: none; border-radius: 12px; padding: 14px;
            font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; box-shadow: 0 4px 20px var(--accent-gold-glow);
            transition: transform 0.05s ease;
        }
        .btn-upgrade-main:active { transform: scale(0.97); }
        .btn-upgrade-main:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

        /* Сетка выбора предметов */
        .picker-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; }
        .items-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            max-height: 180px; overflow-y: auto; padding-right: 4px;
        }
        .item-card-mini {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; padding: 8px; text-align: center; cursor: pointer;
        }
        .item-card-mini:active { transform: scale(0.95); background: rgba(255,255,255,0.08); }
        .item-card-mini.selected { border-color: var(--accent-gold); background: rgba(255,183,0,0.1); }
        .item-card-mini .emoji { font-size: 22px; }
        .item-card-mini .name { font-size: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-card-mini .price { font-size: 10px; font-weight: 900; color: var(--accent-gold); }

        /* Вылетающий текст */
        .floating-text { position: fixed; font-weight: 900; font-size: 20px; pointer-events: none; z-index: 999; animation: floatUp 0.6s forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); } 100% { opacity: 0; transform: translate(-50%, -100px) scale(1.2); } }
    </style>
</head>
<body>

    <div class="header">
        <span class="title">VEX // UPGRADE</span>
        <div class="balance-box" id="balance">1,000 VEX</div>
    </div>

    <!-- Клик кнопка фарма -->
    <div class="tap-btn" onclick="handleTap(event)">
        ⚡ ФАРМИТЬ БАЛАНС (+10 VEX)
    </div>

    <!-- ЗОНА АПГРЕЙДА (РУЛЕТКА В ЦЕНТРЕ) -->
    <div class="upgrade-container">
        <div class="upgrade-slots">
            
            <!-- Левый слот: Твой предмет -->
            <div class="slot-card active" id="slot-my">
                <span class="slot-label">Ваш предмет</span>
                <div class="slot-emoji" id="my-emoji">🛴</div>
                <div class="slot-name" id="my-name">Самокат</div>
                <div class="slot-price" id="my-price">100 VEX</div>
            </div>

            <!-- Центр: Радиальный круг с процентом -->
            <div class="wheel-box">
                <svg class="wheel-svg" viewBox="0 0 100 100">
                    <circle class="wheel-bg" cx="50" cy="50" r="45"></circle>
                    <circle class="wheel-progress" id="wheel-arc" cx="50" cy="50" r="45"></circle>
                </svg>
                <div class="wheel-arrow" id="wheel-needle"></div>
                <div class="chance-text">
                    <span id="chance-val">50.00%</span>
                    <span class="chance-sub">ШАНС</span>
                </div>
            </div>

            <!-- Правый слот: Цель -->
            <div class="slot-card" id="slot-target">
                <span class="slot-label">Цель</span>
                <div class="slot-emoji" id="target-emoji">📱</div>
                <div class="slot-name" id="target-name">iPhone 11</div>
                <div class="slot-price" id="target-price">200 VEX</div>
            </div>

        </div>

        <button class="btn-upgrade-main" id="btn-upgrade" onclick="runUpgrade()">⚡ ПРОКАЧАТЬ</button>
    </div>

    <!-- Каталог предметов для выбора цели -->
    <div class="picker-header">
        <span>Выбрать целевой предмет:</span>
    </div>
    <div class="items-grid" id="catalog-grid">
        <!-- Генерируется через JS -->
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg.expand) tg.expand();

        let balance = 1000;
        let isRolling = false;

        // Предметы в инвентаре / магазине
        const SKINS = [
            { id: 1, name: "Старый Самокат", price: 100, emoji: "🛴" },
            { id: 2, name: "iPhone 11", price: 200, emoji: "📱" },
            { id: 3, name: "Игровой ПК", price: 500, emoji: "🖥️" },
            { id: 4, name: "Приора B33", price: 1200, emoji: "🏎️" },
            { id: 5, name: "Перчатки 'Scarlet'", price: 3000, emoji: "🧤" },
            { id: 6, name: "Tesla Model S", price: 8000, emoji: "⚡" },
            { id: 7, name: "Керамбит 'Gradation'", price: 20000, emoji: "🔪" },
            { id: 8, name: "Вилла в Дубае", price: 50000, emoji: "🏰" },
            { id: 9, name: "Бизнес-Джет", price: 150000, emoji: "🛩️" }
        ];

        let myItem = SKINS[0];      // Начальный выбор предмета у игрока
        let targetItem = SKINS[1];  // Начальный выбор цели

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString() + ' VEX';

            // Карточка слева
            document.getElementById('my-emoji').innerText = myItem ? myItem.emoji : '❓';
            document.getElementById('my-name').innerText = myItem ? myItem.name : 'Нет предмета';
            document.getElementById('my-price').innerText = myItem ? `${myItem.price.toLocaleString()} VEX` : '0 VEX';

            // Карточка справа
            document.getElementById('target-emoji').innerText = targetItem ? targetItem.emoji : '❓';
            document.getElementById('target-name').innerText = targetItem ? targetItem.name : 'Выберите';
            document.getElementById('target-price').innerText = targetItem ? `${targetItem.price.toLocaleString()} VEX` : '0 VEX';

            // Расчет шанса: (Мой предмет / Цель) * 100
            let chance = 0;
            if (myItem && targetItem) {
                chance = (myItem.price / targetItem.price) * 100;
                if (chance > 95) chance = 95; // Максимальный шанс 95%
            }

            document.getElementById('chance-val').innerText = chance.toFixed(2) + '%';

            // Обновление зеленого сектора в SVG (окружность ~ 283)
            const circumference = 283;
            const strokeOffset = circumference - (circumference * (chance / 100));
            document.getElementById('wheel-arc').style.strokeDashoffset = strokeOffset;

            // Кнопка
            const btn = document.getElementById('btn-upgrade');
            if (!myItem || !targetItem || myItem.price >= targetItem.price || isRolling) {
                btn.disabled = true;
                if (myItem && targetItem && myItem.price >= targetItem.price) {
                    btn.innerText = "ЦЕЛЬ ДЕШЕВЛЕ ТЕКУЩЕГО";
                } else if (isRolling) {
                    btn.innerText = "КРУТИМ...";
                } else {
                    btn.innerText = "ВЫБЕРИТЕ ЦЕЛЬ";
                }
            } else {
                btn.disabled = false;
                btn.innerText = "⚡ ПРОКАЧАТЬ";
            }

            renderCatalog();
        }

        // Рендер каталога целей
        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';

            SKINS.forEach(skin => {
                const el = document.createElement('div');
                el.className = `item-card-mini ${targetItem && targetItem.id === skin.id ? 'selected' : ''}`;
                el.onclick = () => {
                    if (isRolling) return;
                    targetItem = skin;
                    updateUI();
                };
                el.innerHTML = `
                    <div class="emoji">${skin.emoji}</div>
                    <div class="name">${skin.name}</div>
                    <div class="price">${skin.price.toLocaleString()} VEX</div>
                `;
                grid.appendChild(el);
            });
        }

        // Запуск рулетки (анимация кручения стрелки)
        function runUpgrade() {
            if (isRolling || !myItem || !targetItem) return;

            const chance = Math.min(95, (myItem.price / targetItem.price) * 100);
            isRolling = true;
            updateUI();

            const needle = document.getElementById('wheel-needle');
            
            // Расчет победного угла (выигрышный сектор от 0 до (chance/100)*360 градусов)
            const winAngle = (chance / 100) * 360;
            const isSuccess = (Math.random() * 100) <= chance;

            // Определяем финальный угол остановки стрелки
            let finalDegrees;
            if (isSuccess) {
                // Стрелка останавливается в зеленом секторе
                finalDegrees = Math.random() * (winAngle - 5) + 2; 
            } else {
                // Стрелка останавливается в красном секторе
                finalDegrees = Math.random() * (355 - winAngle) + winAngle + 2;
            }

            // Добавляем 5 полных оборотов (1800 deg) для эффекта вращения
            const totalRotation = 1800 + finalDegrees;
            needle.style.transform = `translateX(-50%) rotate(${totalRotation}deg)`;

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            setTimeout(() => {
                if (isSuccess) {
                    // УСПЕХ: предмет заменяется на целевой
                    myItem = targetItem;
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    alert(`🎉 УСПЕХ! Вы получили [${targetItem.name}]!`);
                } else {
                    // НЕУДАЧА: предмет сгорает
                    myItem = null;
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    alert(`💥 НЕУДАЧА! Предмет сгорел.`);
                }

                // Сброс положения стрелки без анимации
                needle.style.transition = 'none';
                needle.style.transform = `translateX(-50%) rotate(${finalDegrees % 360}deg)`;
                setTimeout(() => needle.style.transition = 'transform 2s cubic-bezier(0.15, 0.9, 0.2, 1)', 50);

                isRolling = false;
                updateUI();
            }, 2000);
        }

        // Тапалка фарма баланса
        function handleTap(e) {
            balance += 10;
            const x = e.clientX || window.innerWidth / 2;
            const y = e.clientY || window.innerHeight / 2;
            
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = '+10 VEX';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.color = '#ffb700';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);

            updateUI();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        updateUI();
    </script>
</body>
</html>
